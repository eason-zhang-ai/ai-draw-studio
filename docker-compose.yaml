services:
  ai-draw-studio:
    image: ai-draw-studio:latest
    build:
      context: .
    container_name: ai-draw-studio
    pull_policy: never
    ports:
      - "6001:6001"
    environment:
      AI_BASE_URL: ${AI_BASE_URL}
      AI_API_KEY: ${AI_API_KEY}
      AI_MODEL: ${AI_MODEL}
      AI_MAX_OUTPUT_TOKENS: ${AI_MAX_OUTPUT_TOKENS}
      AI_THINKING_LEVEL: ${AI_THINKING_LEVEL}  # none/low/medium/high
      AI_MODEL_SUPPORTS_VISION: ${AI_MODEL_SUPPORTS_VISION}  # true/false
      AI_CONTEXT_LENGTH: ${AI_CONTEXT_LENGTH}  # input token budget, unset = model default
      AI_SKILL_CONTEXT: ${AI_SKILL_CONTEXT}  # compact (default) | full
      AI_PROGRESSIVE_DRAW: ${AI_PROGRESSIVE_DRAW}  # true (default) | false
    restart: unless-stopped
